name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # The image's default Xcode ships a SwiftPM that reloads every dependency
      # manifest and then stops without starting a test, so the newest one on
      # the runner is used instead.
      - name: Toolchain
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          swift --version
      - name: Build
        run: swift build
        timeout-minutes: 15
      - name: Run the tests
        run: swift test
        timeout-minutes: 12

  linux:
    runs-on: ubuntu-24.04
    container: swift:6.1-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test

  workspace:
    runs-on: ubuntu-24.04
    container: swift:6.1-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # The examples have to keep parsing: they are what people copy from.
      - run: swift run stamp check "Examples/Public APIs"
      - run: swift run stamp list "Examples/Public APIs"
