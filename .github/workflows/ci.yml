name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # macOS proves it compiles there. It does not run the tests, and the name says
  # so rather than leaving a green tick to be read as more than it is: swift test
  # on the macos-15 image reloads every dependency manifest and then stops
  # without starting a test, on the default Xcode and on the newest one the image
  # carries, with and without SwiftPM's sandbox. Running the built bundle with
  # xctest instead executes nothing, because these are swift-testing tests and
  # that runner only knows XCTest. The tests themselves run on Linux below, in
  # the same container on every push, and on a Mac before anything is published.
  macos-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build, and the tests, without running them
        run: |
          swift --version
          swift build
          swift build --build-tests

  linux:
    runs-on: ubuntu-24.04
    container: swift:6.1-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test

  workspace:
    runs-on: ubuntu-24.04
    container: swift:6.1-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # The examples have to keep parsing: they are what people copy from.
      - run: swift run stamp check "Examples/Public APIs"
      - run: swift run stamp list "Examples/Public APIs"
