name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test

  linux:
    runs-on: ubuntu-24.04
    container: swift:6.1-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test

  workspace:
    runs-on: ubuntu-24.04
    container: swift:6.1-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # The examples have to keep parsing: they are what people copy from.
      - run: swift run stamp check "Examples/Public APIs"
      - run: swift run stamp list "Examples/Public APIs"
