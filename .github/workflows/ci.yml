name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # Three steps rather than two, each with its own cap: a step that runs out
      # of time fails and keeps its log, where a job that runs out is cancelled
      # and the log goes with it.
      - name: Build
        run: swift build
        timeout-minutes: 15
      - name: Build the tests
        run: swift build --build-tests
        timeout-minutes: 15
      - name: Run the tests
        run: swift test --skip-build
        timeout-minutes: 8

  linux:
    runs-on: ubuntu-24.04
    container: swift:6.1-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test

  workspace:
    runs-on: ubuntu-24.04
    container: swift:6.1-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # The examples have to keep parsing: they are what people copy from.
      - run: swift run stamp check "Examples/Public APIs"
      - run: swift run stamp list "Examples/Public APIs"
